{% extends "base.html" %}
{% block title %}{{ t.product.list.title }} - {{ t.nav.brand }}{% endblock %}
{% block content %}

<form class="mr-panel mr-filters" method="get" action="{{ url('/products') }}"
      hx-get="{{ url('/products') }}" hx-trigger="input changed delay:300ms from:#search-q, change from:select"
      hx-target="#product-rows" hx-swap="outerHTML" hx-push-url="true">
  <div class="mr-filter mr-filter-grow">
    <label for="search-q">{{ t.product.list.filter_label }}</label>
    <input type="search" id="search-q" name="q" value="{{ q }}" placeholder="{{ t.product.list.search_placeholder }}">
  </div>
  <div class="mr-filter">
    <label for="filter-protocol">{{ t.product.list.protocol_label }}</label>
    <select id="filter-protocol" name="protocol">
      <option value="" {% if not active_protocol %}selected{% endif %}>{{ t.product.list.all_protocols }}</option>
      {% for p in protocols %}<option value="{{ p.value }}" {% if active_protocol == p.value %}selected{% endif %}>{{ p.label }}</option>{% endfor %}
    </select>
  </div>
  {% if vendors %}<div class="mr-filter">
    <label for="filter-vendor">{{ t.product.list.vendor_label }}</label>
    <select id="filter-vendor" name="vendor">
      <option value="" {% if not active_vendor %}selected{% endif %}>{{ t.product.list.all_vendors }}</option>
      {% for v in vendors %}<option value="{{ v }}" {% if active_vendor == v %}selected{% endif %}>{{ v }}</option>{% endfor %}
    </select>
  </div>{% endif %}
  <input type="hidden" name="view" value="{{ active_view }}">
</form>

{% include "products/_rows.html" %}
<script src="{{ url('/static/list_view.js') }}"></script>
{% endblock %}
